<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <!-- Hardcoded rather than templated from VITE_APP_NAME/VITE_APP_TAGLINE/
         VITE_APP_DESCRIPTION: Vite's %ENV_VAR% HTML interpolation only
         substitutes variables that are actually defined at build time, and
         when one was missing it shipped the literal "% VITE_APP_TAGLINE %"
         (no spaces in the real placeholder) text — which social platforms
         then unfurled as the shared link's
         preview title/description. Update these two lines directly if the
         branding changes. -->
    <title>PinTogather - Pin Your People, Pin Your Favorite Places</title>
    <meta name="description" content="Create a shared map with your community. Mark where everyone is, or search and add a specific venue — restaurants, cafes, landmarks, anywhere. One shared map, built together.">

    <!-- Open Graph tags -->
    <meta property="og:title" content="PinTogather - Pin Your People, Pin Your Favorite Places">
    <meta property="og:description" content="Create a shared map with your community. Mark where everyone is, or search and add a specific venue — restaurants, cafes, landmarks, anywhere. One shared map, built together.">
    <meta property="og:type" content="website">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
