<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <!-- Hardcoded rather than templated from VITE_APP_NAME/VITE_APP_TAGLINE/
         VITE_APP_DESCRIPTION: Vite's %ENV_VAR% HTML interpolation only
         substitutes variables that are actually defined at build time, and
         when one was missing it shipped the literal "% VITE_APP_TAGLINE %"
         (no spaces in the real placeholder) text — which social platforms
         then unfurled as the shared link's
         preview title/description. Update these two lines directly if the
         branding changes. -->
    <title>PinGather — Collect places, links, and recommendations together</title>
    <meta name="description" content="Build a shared collection with your community — places on a map, links that fill themselves in, or anything worth recommending. Add a whole list from a paste, a file, or a screenshot.">

    <!-- Open Graph tags -->
    <meta property="og:title" content="PinGather — Collect places, links, and recommendations together">
    <meta property="og:description" content="Build a shared collection with your community — places on a map, links that fill themselves in, or anything worth recommending. Add a whole list from a paste, a file, or a screenshot.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://pintogather.vercel.app/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Twitter Card tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="PinGather — Collect places, links, and recommendations together">
    <meta name="twitter:description" content="Build a shared collection with your community — places on a map, links that fill themselves in, or anything worth recommending. Add a whole list from a paste, a file, or a screenshot.">
    <meta name="twitter:image" content="https://pintogather.vercel.app/og-image.png">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
