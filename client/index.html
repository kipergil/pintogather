<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <!-- Title/description come from VITE_APP_NAME/VITE_APP_TAGLINE/VITE_APP_DESCRIPTION
         (root .env — see .env.example) via Vite's built-in %ENV_VAR% HTML
         interpolation, so a rename doesn't require editing this file. -->
    <title>%VITE_APP_NAME% - %VITE_APP_TAGLINE%</title>
    <meta name="description" content="%VITE_APP_DESCRIPTION%">

    <!-- Open Graph tags -->
    <meta property="og:title" content="%VITE_APP_NAME% - %VITE_APP_TAGLINE%">
    <meta property="og:description" content="%VITE_APP_DESCRIPTION%">
    <meta property="og:type" content="website">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
