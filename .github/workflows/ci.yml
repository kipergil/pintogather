name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a maintainer re-run the suite without pushing an empty commit.
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # The suite never reaches a real Directus/Clerk/Stripe/Anthropic —
      # test/setup.server.ts supplies dummies and the tests mock every
      # outbound edge. These are here only so any import-time config read
      # finds something, and so a missing repo secret can't fail the build.
      NODE_ENV: test
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Typecheck (web, server, shared)
        run: npm run check

      - name: Test
        run: npm run test -- --reporter=default --reporter=junit --outputFile=test-results.xml

      - name: Build
        run: npm run build

      - name: Install mobile dependencies
        run: npm --prefix mobile ci

      - name: Typecheck (mobile)
        # Expo/React Native components aren't exercised by the Vitest suite —
        # that needs the jest-expo toolchain, which isn't set up here. Until
        # it is, typecheck is the mobile app's gate.
        run: npm --prefix mobile run check

      - name: Upload test results
        # Publish the report even when tests fail — that's exactly when it's
        # worth reading.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: ignore

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Informational for now: no threshold is enforced, so this reports the
    # number without being able to block a merge on it.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
