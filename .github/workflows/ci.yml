name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a maintainer re-run the suite without pushing an empty commit.
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # The suite never reaches a real Directus/Clerk/Stripe/Anthropic —
      # test/setup.server.ts supplies dummies and the tests mock every
      # outbound edge. These are here only so any import-time config read
      # finds something, and so a missing repo secret can't fail the build.
      NODE_ENV: test
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Read from .nvmrc rather than pinned here, so CI and local can't
          # drift apart. The floor is real: jsdom pulls in undici@8, which
          # needs node >= 22.19 for worker_threads.markAsUncloneable — on
          # Node 20 every jsdom test file fails to start its worker.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Typecheck (web, server, shared)
        run: npm run check

      - name: Test
        # Coverage runs here rather than in a second job: a separate job meant
        # doubling checkout+install for a number nobody blocks on, and its
        # red X read like a real failure.
        run: npm run test -- --coverage --reporter=default --reporter=junit --outputFile=test-results.xml

      - name: Build
        run: npm run build

      - name: Install mobile dependencies
        run: npm --prefix mobile ci

      - name: Typecheck (mobile)
        # Expo/React Native components aren't exercised by the Vitest suite —
        # that needs the jest-expo toolchain, which isn't set up here. Until
        # it is, typecheck is the mobile app's gate.
        run: npm --prefix mobile run check

      - name: Upload test results and coverage
        # Publish even when tests fail — that's exactly when it's worth reading.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.xml
            coverage/
          if-no-files-found: ignore
